name: Idea
description: Something DialCatz Den could do, or do better.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: >
        Ideas are welcome here. Big ones are talked through here before anyone builds them.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job, not the solution yet — "we add every new teammate to five workspaces one by one".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: How you get by today, sketches, screenshots.
